<!DOCTYPE html>
<html>
    <head>
        <title>Url Shortener</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="static/styles.css" />
        <script src="static/script.js" defer></script>
    </head>
    <body>
        <header class="header">
            <h2 class="header-title">Url Shortener</h2>
            <h4 class="header-moto">Hepls you to short your problems</h4>
            <nav class="header-account">
                <a id="sign_in_btn" class="account-btn" href="#">Sign In</a>
                <a id="sign_up_btn" class="account-btn" href="#">Sign Up</a>
            </nav>
        </header>

        <main>
            <div class="shortener-container">
                <h2 class="shortener-header">Shorten the URL</h2>
                <div class="shortener-form">
                    <input type="url" name="url" id="url-input" placeholder="Put your URL here" />
                    <button id="url-submit">Shorten</button>
                </div>
                <a id="url-id" target="_blank"></a>
                <h3 id="url-id-error">Service is temporary unavailable</h3>
            </div>
        </main>
    </body>
</html>
